<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2>Expense Tracker</h2>
        
        <!-- Summary Cards -->
        <div class="summary">
            <div class="card"><h4>Balance</h4><p id="balance">₹0.00</p></div>
            <div class="card income"><h4>Income</h4><p id="income">+₹0.00</p></div>
            <div class="card expense"><h4>Expense</h4><p id="expense">-₹0.00</p></div>
        </div>

        <!-- Form -->
        <div class="form-group">
            <input type="text" id="description" placeholder="Description (e.g., Salary, Food)">
            <input type="number" id="amount" placeholder="Amount">
            <select id="category">
                <option value="Food">Food</option>
                <option value="Salary">Salary</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
            <input type="date" id="date">
            <button onclick="addTransaction()">Add Transaction</button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <select id="filterCategory" onchange="renderTransactions()">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Salary">Salary</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- List -->
        <ul id="transactionList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
